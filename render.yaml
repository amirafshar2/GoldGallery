# Render Blueprint — public SHOWCASE of the gold shop site (demo logins, sandbox payments, auto-reset).
# Render → New → Blueprint → choose this repo. Secrets are generated by Render, never stored in git.
services:
  - type: web
    name: gold-showcase
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Showcase
      - key: Seed__Profile
        value: Moraveji
      - key: Jwt__Key
        generateValue: true
      - key: Security__HashKey
        generateValue: true
